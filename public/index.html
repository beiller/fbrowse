<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Media Browser</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; }
    .grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .thumb { 
      width: 150px; 
      cursor: pointer; 
      background: #ccc;
      min-height: 100px;
    }
    .thumb img, .thumb video {
      width: 150px;
      object-fit: cover; 
      min-height: 100px;
      /* width: 100%; 
      height: 100%; */
    }
    .fullscreen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; margin: 0px; padding: 0px;
      background: rgba(0, 0, 0, 0.9);
      display: none; align-items: center; justify-content: center;
      flex-direction: column;
      height: 100%;
    }
    .fullscreen img, .fullscreen video {
      /* max-width: 100%; */
      /* max-height: 90vh; */
    }
    .media-container {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    .media-container video, .media-container img {
      height: 100%;margin: 0;padding: 0;
    }
    .controls {
      color: white;
      
      position: absolute;
      bottom: 20px;
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      height: 5%;
    }
    .controlsButtons {
      position: relative;
      height: 100%;
    }
    .controlsButtons button {
      width: 10em;
    }
  </style>
</head>
<body>

  <button id="upBtn">⬆️ Up</button>
  <button id="vBtn">⬆️ Video</button>
  <button id="iBtn">⬆️ Image</button>
  <button onclick="toggleFavouriteView()">FAV</button>
  <div id="grid" class="grid"></div>

  <script type="text/javascript">
const playBackwards = function (video) {
    video.pause();
    let fps = 16;
    let intervalRewind = setInterval(function () {
        if (video.currentTime <= 0) {
            clearInterval(intervalRewind);
            video.pause();
        } else {
            video.currentTime -= 1 / fps;
        }
    }, 1000 / fps);
};

  </script>

  <div id="fullscreen" class="fullscreen">
    <div class="media-container"></div>
    <div class="controls">
      <div class="controlsButtons">
        <button onclick="prev()">⬅️</button>
        <button onclick="next()">➡️</button>
        <button onclick="exitFullscreenMode()">❌</button>
        <!-- <button onclick="playBackwards(getHTMLVideoElement())">▶️</button> -->
        <button onclick="toggleForwardsRepeat()">▶️</button>
        <!-- <input id="seek" type="range" value="0" min="0" max="100" step="0.1"> -->
        <button onclick="toggleSkipImages();">IMG</button>
        <button onclick="setEnableFullscreen(!getEnableFullscreen())">FS</button>
      </div>
    </div>
  </div>

  <script src="ui.js"></script>
</body>
</html>
