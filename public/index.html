<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Media Browser</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; touch-action: manipulation; }
    .grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .thumb { 
      width: 150px; 
      cursor: pointer; 
      background: #ccc;
      min-height: 100px;
    }
    .thumb img, .thumb video {
      width: 150px;
      object-fit: cover; 
      min-height: 100px;
    }
    .fullscreen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; margin: 0px; padding: 0px; z-index: 10;
      background: rgba(0, 0, 0, 0.9);
      display: none; align-items: center; justify-content: center;
      flex-direction: column;
      height: 100%;
    }
    .media-container {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex; align-items: center; justify-content: center;
      margin: 0; padding: 0;
    }
    .media-container video, .media-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      margin: 0; padding: 0;
    }
    .controls {
      color: white;
      position: absolute; left: 0; right: 0; bottom: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      padding: 4px 8px;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .controls.hidden {
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
    }
    .plpick-fsbtn {
      position: absolute; top: 12px; right: 12px; z-index: 11;
      min-height: 36px; border: none; border-radius: 6px; cursor: pointer;
      background: rgba(58, 58, 58, 0.9); color: #fff; padding: 0 10px; font-size: 15px;
      transition: opacity 0.25s ease;
    }
    .plpick-fsbtn.hidden { opacity: 0; pointer-events: none; }
    .controlsButtons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .controlsButtons button {
      min-width: 44px;
      min-height: 44px;
      padding: 6px 10px;
      font-size: 15px;
      border-radius: 6px;
    }
    .controlsButtons button.active { background: rgba(46, 204, 113, 0.18); color: #2ecc71; box-shadow: inset 0 0 0 1px #2ecc71; }
    .grid > div { position: relative; }
    .votebox {
      position: absolute; top: 2px; right: 2px; z-index: 2;
      display: none; flex-direction: column; gap: 2px;
    }
    .grid > div:hover .votebox { display: flex; }
    .votebox button {
      min-width: 26px; height: 24px; padding: 0 4px; font-size: 12px; line-height: 1;
      background: rgba(0, 0, 0, 0.55); color: #fff; border: none;
      border-radius: 3px; cursor: pointer;
    }
    .votebox button.up.active { background: #2ecc71; }
    .votebox button.down.active { background: #e74c3c; }
    .votescore {
      position: absolute; left: 2px; bottom: 2px; z-index: 2;
      background: rgba(0, 0, 0, 0.55); color: #fff; font-size: 11px;
      padding: 1px 4px; border-radius: 3px; display: none;
    }
    .votescore.show { display: block; }

    .pladd {
      position: absolute; top: 2px; left: 2px; z-index: 2;
      width: 26px; height: 24px; padding: 0; font-size: 13px; line-height: 1;
      background: rgba(0, 0, 0, 0.55); color: #fff; border: none;
      border-radius: 3px; cursor: pointer; display: none;
    }

    .grid > div:hover .pladd { display: block; }

    .plrem {
      position: absolute; bottom: 2px; right: 2px; z-index: 2;
      width: 26px; height: 24px; padding: 0; font-size: 12px; line-height: 1;
      background: rgba(231, 76, 60, 0.85); color: #fff; border: none;
      border-radius: 3px; cursor: pointer; display: none;
    }

    .grid > div:hover .plrem { display: block; }

    .thumb.drop-before { box-shadow: -3px 0 0 0 #2ecc71; }

    .thumb.drop-after { box-shadow: 3px 0 0 0 #2ecc71; }

    .plpick-ov {
      position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.6);
      display: flex; align-items: center; justify-content: center;
    }

    .plpick-box {
      background: #1e1e1e; color: #fff; border-radius: 8px; padding: 12px;
      width: min(360px, 90vw); max-height: 80vh; overflow-y: auto;
    }

    .plpick-ov-drop { align-items: flex-start; justify-content: flex-start; pointer-events: none; }

    .plpick-ov-drop .plpick-box {
      position: fixed; pointer-events: auto;
      width: min(300px, 90vw); max-height: min(70vh, 360px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }

    .plpick-title { font-size: 15px; font-weight: bold; margin-bottom: 8px; }

    .plpick-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }

    .plpick-item {
      display: flex; align-items: center; gap: 6px; padding: 4px 6px;
      background: #2a2a2a; border-radius: 4px;
    }

    .plpick-item span { flex: 1; cursor: pointer; }

    .plpick-row { display: flex; gap: 6px; margin-bottom: 8px; }

    .plpick-row input { flex: 1; padding: 6px; border-radius: 4px; border: none; }

    .plpick-box button { min-height: 30px; border: none; border-radius: 4px; cursor: pointer; background: #3a3a3a; color: #fff; padding: 0 8px; }

  </style>
</head>
<body>

  <button id="upBtn">⬆️ Up</button>
  <button id="vBtn">⬆️ Video</button>
  <button id="iBtn">⬆️ Image</button>
  <button id="fBtn">ALL</button>
  <button onclick="toggleFavouriteView()">FAV</button>
  <button id="playBtn">&#9654; PLAY</button>
  <div id="grid" class="grid"></div>

  <div id="fullscreen" class="fullscreen">
    <div class="media-container"></div>
    <div class="controls">
      <div class="controlsButtons">
        <button onclick="prev()">⬅️</button>
        <button onclick="togglePlayPause()">⏯</button>
        <button onclick="next()">➡️</button>
        <button onclick="exitFullscreenMode()">❌</button>
        <button id="repeatBtn" onclick="toggleForwardsRepeat()">🔁</button>
        <button onclick="toggleSkipImages();">IMG</button>
        <button onclick="setEnableFullscreen(!getEnableFullscreen())">FS</button>
      </div>
    </div>
  </div>

  <script src="ui.js"></script>
</body>
</html>
